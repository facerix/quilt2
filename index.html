<!doctype html>

<html lang="en" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Quilt</title>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="A tile-shifting puzzle game — something like a 2-D Rubik's cube."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#222844" />
    <link rel="canonical" href="https://quilt.facerix.com/" />
    <meta property="og:title" content="Quilt" />
    <meta
      property="og:description"
      content="A tile-shifting puzzle game — something like a 2-D Rubik's cube."
    />
    <meta property="og:url" content="https://quilt.facerix.com/" />
    <meta property="og:type" content="website" />
    <meta http-equiv="Content-Language" content="en" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="stylesheet" href="/main.css" type="text/css" charset="utf-8" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="modulepreload" href="/index.js" />
  </head>

  <body class="u-fill-height">
    <header id="main-head">
      <a class="header-identity" href="/">
        <img id="logo" src="/images/logo.png" alt="" />
        <h1>Quilt</h1>
      </a>
      <button id="btnHelp" type="button">Help</button>
    </header>

    <main>
      <div id="game">
        <quilt-board id="board"></quilt-board>
        <p id="banner" class="u-hidden" role="status"></p>
      </div>

      <div id="hud">
        <p id="levelLabel">Level 1</p>
        <div id="goal">
          <h3>Goal</h3>
          <quilt-board id="preview" readonly></quilt-board>
        </div>
      </div>

      <div id="controls">
        <div id="pad">
          <button id="btnShiftUp" type="button" title="Shift up (I)">&uarr;</button>
          <button id="btnShiftLeft" type="button" title="Shift left (J)">&larr;</button>
          <button id="btnShiftDown" type="button" title="Shift down (K)">&darr;</button>
          <button id="btnShiftRight" type="button" title="Shift right (L)">&rarr;</button>
        </div>
        <button id="btnRestart" type="button">Restart level</button>
      </div>
    </main>

    <footer id="main-foot">A&nbsp;<a href="/about.html">Facerix</a>&nbsp;creation</footer>

    <help-overlay></help-overlay>
    <update-notification></update-notification>
  </body>
  <script src="/index.js" type="module"></script>
</html>
